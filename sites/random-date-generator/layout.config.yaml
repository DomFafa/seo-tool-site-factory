schemaVersion: 1
recipe: tiny-tool-workbench
chrome:
  navVariant: compact
  footerVariant: simple
  headerLinks:
    - label: FAQ
      href: /faq/
    - label: Contact
      href: /contact/
  footerLinks:
    - label: About
      href: /about/
    - label: Contact
      href: /contact/
    - label: Privacy
      href: /privacy/
    - label: FAQ
      href: /faq/
    - label: Calculation method
      href: /calculation-method/
home:
  blocks:
    - type: hero
      variant: search-first-tool
      props:
        eyebrow: Date utility
        title: Random
        rotatingWords:
          - date
          - 30 days
          - birthdays
          - workdays
          - test data
        titleSuffix: Generator
        description: Pick random dates from a range, filter weekdays, choose a format, and copy clean results in seconds.
        badges: []
    - type: tool
      variant: central-panel
    - type: examples
      variant: utility-grid
      props:
        title: Random date ideas
        items:
          - "Generate 12 random birthdays between 1980 and 2005."
          - "Pick one event date from the next 90 days, excluding weekends."
          - "Create test data in ISO format for CSV imports."
          - "Choose random workdays for a content calendar."
          - "Shuffle dates before copying them into a spreadsheet."
    - type: howItWorks
      variant: clean-steps
      props:
        title: How to generate random dates
        steps:
          - Choose a start date and end date.
          - Set how many dates you need and which weekdays are allowed.
          - Generate, sort, and copy the dates in your preferred format.
    - type: privacyNote
      variant: inline
      props:
        title: Local random date generation
        text: Dates are generated in your browser. Raw selected ranges are not sent to analytics.
    - type: content
      variant: lower-guide
    - type: faq
      variant: compact
