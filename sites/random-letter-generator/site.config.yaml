schemaVersion: 1
id: random-letter-generator
brandName: Random Letter Generator
category: generator
primaryKeyword: random letter generator
lifecycle:
  status: live
launch:
  stage: real-domain-indexed
domains:
  production: random-lettergenerator.com
  canonicalHost: random-lettergenerator.com
  aliases:
    - www.random-lettergenerator.com
defaultLocale: en
locales:
  en:
    enabled: true
    indexable: true
    reviewed: true
indexing:
  allowIndex: true
  mode: index
primaryTool: random-letter-generator
seo:
  defaultTitle: Random Letter Generator - Pick Letters, Teams, and Sequences
  defaultDescription: Generate random letters from A-Z, custom alphabets, no-repeat sets, vowels, consonants, and copy-ready classroom or game lists.
  xDefaultLocale: en
  structuredData:
    - WebSite
    - WebPage
    - SoftwareApplication
  sitemap:
    split: false
  ogImage:
    mode: generated
    path: /og-image.svg
  pagesDevRedirect:
    status: configured
    notes: Cloudflare Bulk Redirects verified for pages.dev and alias canonical redirects.
deployment:
  provider: cloudflare-pages
  accountAlias: shared
  projectName: seo-tool-random-letter-generator
  outputDir: dist/sites/random-letter-generator
