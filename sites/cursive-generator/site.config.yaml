schemaVersion: 1
id: cursive-generator
brandName: CursiveType
category: generator
primaryKeyword: cursive generator
lifecycle:
  status: live
domains:
  production: cursivegenerators.net
  canonicalHost: cursivegenerators.net
  aliases:
    - www.cursivegenerators.net
defaultLocale: en
locales:
  en:
    enabled: true
    indexable: true
    reviewed: true
indexing:
  allowIndex: true
  mode: index
primaryTool: cursive-generator
seo:
  defaultTitle: Cursive Generator
  defaultDescription: Generate cursive-style Unicode text that you can copy and use online.
  xDefaultLocale: en
  structuredData:
    - WebSite
    - WebPage
    - SoftwareApplication
  pagesDevRedirect:
    status: configured
    notes: Cloudflare Bulk Redirects verified for pages.dev and alias canonical redirects.
deployment:
  provider: cloudflare-pages
  projectName: seo-tool-cursive-generator
  outputDir: dist/sites/cursive-generator
  accountAlias: cursive-generator
launch:
  stage: real-domain-indexed
