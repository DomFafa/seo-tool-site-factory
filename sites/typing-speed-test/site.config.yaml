schemaVersion: 1
id: typing-speed-test
brandName: SpeedType
category: tester
primaryKeyword: typing speed test
lifecycle:
  status: live
domains:
  production: typing-speed-test.com
  canonicalHost: typing-speed-test.com
  aliases:
    - www.typing-speed-test.com
defaultLocale: en
locales:
  en:
    enabled: true
    indexable: true
    reviewed: true
indexing:
  allowIndex: true
  mode: index
primaryTool: typing-speed-test
seo:
  defaultTitle: Typing Speed Test
  defaultDescription: Test your typing speed online and measure WPM, CPM, accuracy, and errors.
  xDefaultLocale: en
  structuredData:
    - WebSite
    - WebPage
    - SoftwareApplication
  pagesDevRedirect:
    status: configured
    notes: Cloudflare Bulk Redirects verified for pages.dev and alias canonical redirects.
deployment:
  provider: cloudflare-pages
  projectName: seo-tool-typing-speed-test
  outputDir: dist/sites/typing-speed-test
  accountAlias: typing-speed-test
launch:
  stage: real-domain-indexed
