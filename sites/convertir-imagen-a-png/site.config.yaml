schemaVersion: 1
id: convertir-imagen-a-png
brandName: PNG Fácil
category: converter
primaryKeyword: convertir imagen a png
lifecycle:
  status: live
domains:
  production: convertirimagenapng.net
  canonicalHost: convertirimagenapng.net
  aliases:
    - www.convertirimagenapng.net
defaultLocale: es
locales:
  es:
    enabled: true
    indexable: true
    reviewed: true
indexing:
  allowIndex: true
  mode: index
primaryTool: convert-image-to-png
seo:
  defaultTitle: Convertir Imagen a PNG
  defaultDescription: Convierte imágenes JPG, PNG y WebP a PNG directamente en tu navegador.
  xDefaultLocale: es
  structuredData:
    - WebSite
    - WebPage
    - SoftwareApplication
  pagesDevRedirect:
    status: configured
    notes: Cloudflare Bulk Redirects verified for pages.dev and alias canonical redirects.
deployment:
  provider: cloudflare-pages
  projectName: seo-tool-convertir-imagen-a-png
  outputDir: dist/sites/convertir-imagen-a-png
  accountAlias: convertir-imagen-a-png
launch:
  stage: real-domain-indexed
