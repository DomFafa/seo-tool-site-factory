name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate all sites
        run: pnpm site check --all

      - name: Build typing-speed-test
        run: pnpm site build typing-speed-test

      - name: Build convert-image-to-png
        run: pnpm site build convert-image-to-png

      - name: Generate portfolio report
        run: pnpm ops report
